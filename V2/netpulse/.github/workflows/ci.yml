name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install psutil dnspython pytest pytest-cov ruff

      - name: Lint
        run: ruff check netpulse tests

      - name: Test
        run: pytest --cov=netpulse --cov-report=term-missing

  build:
    name: Build a Windows executable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller netpulse.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NetPulse-windows
          path: dist/NetPulse.exe
