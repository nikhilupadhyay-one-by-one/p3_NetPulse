[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "2.0.0"
description = "Network diagnostics and live traffic monitoring, with a desktop interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NetPulse" }]
keywords = ["networking", "monitoring", "diagnostics", "bandwidth", "ping", "traceroute"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["PySide6>=6.6,<7", "psutil>=5.9"]

[project.optional-dependencies]
dns = ["dnspython>=2.4"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
netpulse = "netpulse.cli:main"

[project.gui-scripts]
netpulse-gui = "netpulse.app:main"

[tool.setuptools.packages.find]
include = ["netpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["netpulse"]
omit = ["netpulse/ui/*", "netpulse/app.py"]
